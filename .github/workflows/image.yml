# image -- the LLB toolchain image (container/llb.def, docs/INSTALL_DESIGN.md "CI").
#
#   lock-check  each environments/*.linux-64.lock still matches its *.yml
#   build       apptainer build llb.sif, uploaded as an artifact
#   smoke       /opt/llb/smoke.sh inside that one SIF, under Apptainer 1.3 AND
#               SingularityCE 4.4 (stands in for `llb doctor --no-zbh` until it exists)
#   push        oras://ghcr.io/garn0123/llb-toolchain:<TOOLCHAIN_VERSION>, tags only
#
# BCL: while container/llb.def has BCL_SHA256=TODO (or the GHCR asset can't be
# pulled), the image can only be built with allow_missing_bcl, which pushes and
# PRs set so everything else is tested now. Tag builds never set it and refuse.
name: image

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'container/**'
      - 'environments/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'container/**'
      - 'environments/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      allow_missing_bcl:
        description: 'Build without BCL when BCL_SHA256 is TODO or the asset is missing (never for a release)'
        type: boolean
        default: true

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APPTAINER_VERSION: 1.3.6
  SINGULARITYCE_VERSION: 4.4.1
  SINGULARITYCE_DEB_SHA256: 4851afcc0f60582ef29537702e594e301698338006275c814d44aeda8b75c8bf
  ORAS_VERSION: 1.3.2
  ORAS_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
  CONDA_LOCK_VERSION: 4.0.3
  BCL_ORAS_REF: ghcr.io/garn0123/llb-assets:bcl-4.3.1
  IMAGE_REPO: ghcr.io/garn0123/llb-toolchain

jobs:
  lock-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conda-lock
          create-args: >-
            -c conda-forge python=3.12 conda-lock=${{ env.CONDA_LOCK_VERSION }}
      - name: Lockfiles match their specs
        run: |
          set -euo pipefail
          for env in qupkake db2_converter llb_pka; do
            echo "::group::$env"
            # Solves, but re-renders the lockfile only if its '# input_hash'
            # differs from the spec's: a pure upstream drift leaves it alone.
            conda-lock --micromamba --check-input-hash --kind explicit -p linux-64 \
              -f "environments/$env.yml" \
              --filename-template "environments/$env.{platform}.lock"
            echo "::endgroup::"
          done
          if ! git diff --exit-code --stat -- environments/; then
            echo "::error::a lockfile is stale for its spec: regenerate it (environments/README.md) and commit both"
            git diff -- environments/ | head -200
            exit 1
          fi

  build:
    needs: lock-check
    runs-on: ubuntu-24.04
    outputs:
      allow_missing_bcl: ${{ steps.bcl.outputs.allow }}
      bcl_installed: ${{ steps.meta.outputs.bcl_installed }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          sudo mkdir -p /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/work
          df -h / /mnt

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: ${{ env.APPTAINER_VERSION }}

      - name: Decide allow_missing_bcl
        id: bcl
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            allow=false                                  # a release never skips BCL
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            allow=${{ inputs.allow_missing_bcl || false }}
          else
            allow=true                                   # push / PR: test the rest now
          fi
          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "allow_missing_bcl=$allow"

      - name: Install oras ${{ env.ORAS_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras_${ORAS_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p oras-bin && tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" -C oras-bin oras
          echo "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"

      - name: Pull the BCL tarball into the build context
        env:
          ALLOW: ${{ steps.bcl.outputs.allow }}
        run: |
          set -uo pipefail
          # public package: no login needed
          if oras pull "$BCL_ORAS_REF" -o container/assets; then
            ls -l container/assets
          elif [[ "$ALLOW" == true ]]; then
            echo "::warning title=BCL missing::could not pull $BCL_ORAS_REF; building WITHOUT BCL (allow_missing_bcl)"
          else
            echo "::error::could not pull $BCL_ORAS_REF, and this build may not skip BCL"
            exit 1
          fi
          if [[ "$ALLOW" == true ]]; then
            : > container/assets/ALLOW_MISSING_BCL
            if grep -q '^ *BCL_SHA256=TODO' container/llb.def; then
              echo "::warning title=BCL skipped::BCL_SHA256 is TODO in container/llb.def: this image has no BCL and is not releasable"
            fi
          fi

      - name: Build llb.sif
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/apptainer/tmp /mnt/apptainer/cache
          # from the repository root: llb.def's %files paths are relative to it
          sudo env "PATH=$PATH" APPTAINER_TMPDIR=/mnt/apptainer/tmp APPTAINER_CACHEDIR=/mnt/apptainer/cache \
            apptainer build /mnt/work/llb.sif container/llb.def
          sudo chown "$(id -u):$(id -g)" /mnt/work/llb.sif
          sudo rm -rf /mnt/apptainer
          ls -lh /mnt/work/llb.sif
          sha256sum /mnt/work/llb.sif | tee /mnt/work/llb.sif.sha256

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          apptainer inspect --labels /mnt/work/llb.sif
          apptainer exec /mnt/work/llb.sif cat /opt/llb/manifest.json | tee /mnt/work/manifest.json
          want=$(tr -d '[:space:]' < container/TOOLCHAIN_VERSION)
          got=$(python3 -c 'import json; print(json.load(open("/mnt/work/manifest.json"))["toolchain_version"])')
          [[ "$got" == "$want" ]] || { echo "::error::manifest says $got, TOOLCHAIN_VERSION says $want"; exit 1; }
          echo "bcl_installed=$(python3 -c 'import json; print(str(json.load(open("/mnt/work/manifest.json"))["bcl"]["installed"]).lower())')" >> "$GITHUB_OUTPUT"
          {
            echo "### llb-toolchain $want"
            echo
            echo "- SIF: $(du -h /mnt/work/llb.sif | cut -f1), sha256 \`$(cut -d' ' -f1 /mnt/work/llb.sif.sha256)\`"
            echo "- BCL installed: $(python3 -c 'import json; print(json.load(open("/mnt/work/manifest.json"))["bcl"]["installed"])')"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: llb-sif
          path: |
            /mnt/work/llb.sif
            /mnt/work/llb.sif.sha256
            /mnt/work/manifest.json
          compression-level: 0        # SIF is squashfs, already compressed
          retention-days: 3
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [apptainer, singularity]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llb-sif
          path: ${{ runner.temp }}/sif

      - name: Same SIF the build made
        working-directory: ${{ runner.temp }}/sif
        run: echo "$(cut -d' ' -f1 llb.sif.sha256)  llb.sif" | sha256sum -c -

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - if: matrix.runtime == 'apptainer'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: ${{ env.APPTAINER_VERSION }}

      - if: matrix.runtime == 'singularity'
        name: Install SingularityCE ${{ env.SINGULARITYCE_VERSION }}
        run: |
          set -euo pipefail
          deb="singularity-ce_${SINGULARITYCE_VERSION}-noble_amd64.deb"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/sylabs/singularity/releases/download/v${SINGULARITYCE_VERSION}/${deb}"
          echo "${SINGULARITYCE_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q "./${deb}"

      - name: Runtime version
        run: ${{ matrix.runtime }} --version

      - name: Smoke checks inside the image
        env:
          ALLOW: ${{ needs.build.outputs.allow_missing_bcl }}
          BCL_INSTALLED: ${{ needs.build.outputs.bcl_installed }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$BCL_INSTALLED" != true ]]; then
            [[ "$ALLOW" == true ]] || { echo "::error::image has no BCL and allow_missing_bcl is not set"; exit 1; }
            echo "::warning title=BCL missing::smoke runs with --allow-missing-bcl"
            args=(--allow-missing-bcl)
          fi
          cd "$RUNNER_TEMP"
          # once as llb will run it (env passed through), once with a clean environment
          ${{ matrix.runtime }} exec sif/llb.sif /opt/llb/smoke.sh "${args[@]}"
          ${{ matrix.runtime }} exec --cleanenv sif/llb.sif /opt/llb/smoke.sh "${args[@]}"

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llb-sif
          path: ${{ runner.temp }}/sif
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: ${{ env.APPTAINER_VERSION }}
      - name: Refuse an image without BCL
        run: |
          [[ "${{ needs.build.outputs.bcl_installed }}" == true ]] \
            || { echo "::error::refusing to release an image without BCL"; exit 1; }
      - name: Push oras://${{ env.IMAGE_REPO }}:<TOOLCHAIN_VERSION>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < container/TOOLCHAIN_VERSION)
          echo "$GITHUB_TOKEN" | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push "$RUNNER_TEMP/sif/llb.sif" "oras://${IMAGE_REPO}:${version}"
          echo "pushed oras://${IMAGE_REPO}:${version} (sha256 $(cut -d' ' -f1 "$RUNNER_TEMP/sif/llb.sif.sha256"))" >> "$GITHUB_STEP_SUMMARY"
