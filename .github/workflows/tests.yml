name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environments/llb.yml
          cache-environment: true
      - name: pytest (docking/, common/env.sh)
        run: python -m pytest
      - name: pytest (mol_compiler/)
        working-directory: mol_compiler
        run: python -m pytest
