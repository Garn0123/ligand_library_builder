# db2_converter -- environment for the db2 build (build_ligand, db2_converter
# 63d6656), plus LLB's check-stereo / verify-db2 helpers that import RDKit here.
# Derived from db2_converter's own db2_converter.yml (hnlab/db2_converter).
#
# The toolchain image installs it from db2_converter.linux-64.lock
# (environments/README.md), then installs db2_converter itself from a clone:
#   git clone https://github.com/hnlab/db2_converter /opt/db2_converter
#   git -C /opt/db2_converter checkout 63d6656
#   pip install --no-deps -e /opt/db2_converter
# db2_converter is NOT a pip line here: its setup.py has no package_data, so a
# plain (non-editable) pip install drops amsol/amsol7.1_patched, strain/*.xml and
# the other non-.py files that config.py finds next to itself. Its README
# installs with `pip install -e .`, so the image does the same.
#
# UNICON and conformator (ZBH, licensed per user) and BCL are not conda
# packages; they come from the image (/opt/bcl) and LLB's shims.
#
# Pins:
#   python 3.11      upstream says python=3; 3.11 matches llb_pka and has
#                    rdkit 2024.03.5 builds
#   rdkit 2024.03.5  upstream pins rdkit==2024.3.5 from pip; we take the conda
#                    build of the same version (one numpy, no pip/conda RDKit
#                    mix), the same RDKit as llb_pka, so SMILES canonicalize and
#                    stereo enumerates identically on both sides of the build
#   numpy<2, pandas<3  rdkit 2024.03.5 and posebusters 0.2.9 (2024) predate
#                    numpy 2 and pandas 3 (string dtype, copy-on-write)
#   ambertools, openbabel  unpinned upstream; the lockfile pins them
#   scipy            imported by db2_converter, not listed upstream
#   posebusters 0.2.9, tabulate 0.9.0  as upstream, from pip
name: db2_converter
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit=2024.03.5
  - numpy<2
  - pandas<3
  - scipy
  - ambertools
  - openbabel
  - pip
  - pip:
      - posebusters==0.2.9
      - tabulate==0.9.0
