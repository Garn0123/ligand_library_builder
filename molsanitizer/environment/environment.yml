# MolSanitizer build environment (molsanitizer/environment/install.sh).
#
# MolSanitizer itself comes from PyPI: its wheels carry the compiled conformer,
# stereo and AMSOL extensions (manylinux_2_28 x86_64; Great Lakes is RHEL 8,
# glibc 2.28). Conda supplies only Python and Open Babel, which MolSanitizer
# calls as its embedding fallback after a 2-minute RDKit timeout.
#
# RDKit is pinned to the newest release the MolSanitizer docs list as tested
# (2025.9.1-2026.3.6); 0.7.4 itself only asks for >= 2025.3.1.
#
# After install, the exact environment is frozen in conda-linux-64.lock.txt and
# requirements.lock.txt (install.sh --from-lock rebuilds it from those).
name: msani
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - openbabel=3.1.1
  - pip:
      - -r requirements.txt
